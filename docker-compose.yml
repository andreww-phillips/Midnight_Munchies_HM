services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      CATALOG_MODE: ${CATALOG_MODE:-memory}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      DLV_DISPATCH_QUEUE_FILE: /app/data/dlv-dispatch-queue.txt
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
    # The backend only allows browser requests from http://localhost:5173.
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-data:
